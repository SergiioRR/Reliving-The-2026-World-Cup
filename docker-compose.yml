version: '3.8'

services:
  postgres-source:
    image: postgres:16-alpine
    container_name: mundial2026-pg-source
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword2026
      POSTGRES_DB: mundial2026_relacional
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mundial2026_relacional"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: mundial2026-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres-source

volumes:
  pg_data: